<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#6366f1" />

    <!-- These tags are the static defaults; App.tsx also syncs title/description from src/data/site.json at runtime. -->
    <title>Rahul Singla · Software Development Engineer</title>
    <meta
      name="description"
      content="Rahul Singla — Software Development Engineer at Amazon building backend systems in Java, Spring Boot and AWS that serve 1B+ requests a day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rahul Singla · Software Development Engineer" />
    <meta
      property="og:description"
      content="Software Development Engineer at Amazon building backend systems in Java, Spring Boot and AWS that serve 1B+ requests a day."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved/system theme before React mounts to avoid a flash of the wrong theme. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
